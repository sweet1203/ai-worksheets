<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>인공지능 기초 수업 자료</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#16202c;--muted:#5b6776;--paper:#f3efe7;--line:#e3ddd2;--navy:#0f2742;--amber:#f2a516;
    --course:#2f6fd0;--extra:#1f9d74;--lab:#9b4fc4;--sheet:#0f8a8a;--form:#e0702b;--eval:#d64535;--old:#8a94a3}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.55;
    background-image:radial-gradient(rgba(15,39,66,.07) 1px,transparent 1px);background-size:22px 22px}
  header{background:var(--navy);color:#fff;padding:22px 20px 18px}
  .wrap{max-width:1180px;margin:0 auto}
  header h1{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:2rem;margin:0;line-height:1.2}
  header p{margin:6px 0 0;color:#c8d6e8;font-size:.93rem}
  .tools{position:sticky;top:0;z-index:5;background:rgba(243,239,231,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 20px}
  .tools .wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .tools input[type=search]{flex:1;min-width:200px;font:inherit;padding:8px 12px;border:1px solid #c5ccd5;border-radius:10px;background:#fff}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chips button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font:inherit;font-size:.88rem;cursor:pointer;color:var(--ink)}
  .chips button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
  .tg{font-size:.86rem;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none}
  main{padding:18px 20px 60px}
  .top2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:18px}
  @media (max-width:860px){.top2{grid-template-columns:1fr}}
  .box{background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(15,39,66,.08);padding:16px 18px}
  .box h2{font-size:1rem;margin:0 0 8px}
  .recent{list-style:none;margin:0;padding:0}
  .recent li{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-top:1px dashed var(--line);font-size:.92rem}
  .recent li:first-child{border-top:0}
  .recent time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem;flex:0 0 auto}
  .recent a{color:var(--ink);text-decoration:none;font-weight:700}
  .recent a:hover{text-decoration:underline}
  .legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .unit{margin:26px 0 8px;display:flex;align-items:center;gap:12px}
  .unit .n{font-family:"Black Han Sans",sans-serif;font-size:1.6rem;color:#fff;background:var(--k);border-radius:12px;padding:2px 12px;line-height:1.3}
  .unit h2{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:1.5rem;margin:0}
  .unit .cnt{color:var(--muted);font-size:.85rem}
  .unote{margin:-2px 0 10px;color:var(--muted);font-size:.88rem}
  .les{display:grid;grid-template-columns:70px 1fr;gap:12px;background:#fff;border-radius:14px;box-shadow:0 4px 14px rgba(15,39,66,.06);padding:12px 14px;margin-bottom:8px;border-left:6px solid var(--k)}
  .les.skip{opacity:.55;border-left-style:dashed}
  .les .no{font-family:"Black Han Sans",sans-serif;font-size:1.3rem;color:var(--k);line-height:1.2;word-break:keep-all}
  .les .no small{display:block;font-family:"Noto Sans KR";font-size:.72rem;color:var(--muted)}
  .les h3{margin:0;font-size:1.02rem}
  .les .meta{font-size:.8rem;color:var(--muted);margin-left:6px;font-weight:400}
  .les .sk{display:inline-block;font-size:.76rem;background:#eef0f3;color:#5b6776;border-radius:999px;padding:0 8px;margin-left:6px}
  .les .up{display:inline-block;font-size:.72rem;background:#fff4d6;color:#8a5a00;border-radius:999px;padding:0 8px;margin-left:6px}
  .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .lk{display:inline-flex;align-items:stretch;border:1.5px solid var(--t);border-radius:10px;overflow:hidden;background:#fff;max-width:100%}
  .lk a{display:flex;gap:5px;align-items:center;padding:3px 9px;color:var(--ink);text-decoration:none;font-size:.86rem;min-width:0}
  .lk a b{color:var(--t);font-size:.74rem;flex:0 0 auto}
  .lk a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lk a:hover{background:color-mix(in srgb,var(--t) 10%,white)}
  .lk button{border:0;border-left:1.5px solid var(--t);background:color-mix(in srgb,var(--t) 8%,white);cursor:pointer;font-size:.8rem;padding:0 7px;color:var(--t)}
  .lk button:hover{background:color-mix(in srgb,var(--t) 20%,white)}
  .lk.old{opacity:.75}
  body.hideForm .lk.form, body.hideForm .lk.old{display:none}
  body.hideSkip .les.skip{display:none}
  .tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:700;color:#fff;background:var(--t)}
  .empty{color:var(--muted);text-align:center;padding:30px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
  .toast.on{opacity:1}
  footer{color:var(--muted);font-size:.82rem;text-align:center;padding:10px 20px 30px}
  @media (max-width:560px){header h1{font-size:1.5rem}.les{grid-template-columns:1fr;gap:4px}.les .no{font-size:1.1rem}.les .no small{display:inline;margin-left:6px}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>인공지능 기초 · 2학기 수업 자료</h1>
  <p>교사용 관리 화면. 단원·차시별로 코스웨어, 추가자료, 실습, 질문폼을 한곳에 모았어요. 📋를 누르면 주소가 복사되어 코들에 바로 붙여 넣을 수 있어요.</p>
</div></header>
<div class="tools"><div class="wrap">
  <input type="search" id="q" placeholder="찾기: 차시 번호, 제목, 쪽수, 폼 ID (예: 편향, 102, ai-19)">
  <div class="chips" id="uchips"></div>
  <label class="tg"><input type="checkbox" id="tForm" checked> 질문폼</label>
  <label class="tg"><input type="checkbox" id="tSkip" checked> 하지 않은 차시</label>
</div></div>
<main class="wrap">
  <div class="top2">
    <div class="box"><h2>🆕 최근 업데이트</h2><ul class="recent" id="recent"></ul></div>
    <div class="box"><h2>📌 자주 여는 곳</h2><div class="links" id="common"></div>
      <div class="legend" id="legend"></div></div>
  </div>
  <div id="list"></div>
</main>
<footer>자료를 새로 올리면 <code>catalog.js</code>에 한 줄만 더하면 이 화면에 나타나요. 학생에게 준 각 페이지 주소는 그대로 유지합니다.</footer>
<div class="toast" id="toast"></div>
<script src="catalog.js"></script>
<script>
const TYPES={course:['코스웨어','🖥️'],extra:['추가자료','📄'],lab:['실습','🧪'],sheet:['학습지','🖨️'],form:['질문폼','📝'],eval:['평가','✅'],old:['이전 폼','🗂️']};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let unitSel='all';
function linkHTML([t,label,href]){
  const [tn,ic]=TYPES[t]||['자료','🔗'];
  return `<span class="lk ${t}" style="--t:var(--${t})"><a href="${esc(href)}" target="_blank" rel="noopener" title="${esc(href)}"><b>${ic} ${tn}</b><span>${esc(label)}</span></a><button data-u="${esc(href)}" title="주소 복사">📋</button></span>`;
}
function render(){
  const q=$('q').value.trim().toLowerCase();
  let h='', shown=0;
  UNITS.forEach(u=>{
    if(unitSel!=='all'&&unitSel!==u.id) return;
    const rows=u.lessons.filter(l=>!q||[l.no,l.title,l.pages,l.skip||'',...l.links.map(x=>x[1]+' '+x[2])].join(' ').toLowerCase().includes(q));
    if(!rows.length) return;
    shown+=rows.length;
    h+=`<div class="unit" style="--k:${u.color}"><span class="n">${u.n}</span><h2>${esc(u.title)}</h2><span class="cnt">${rows.length}개</span></div>`;
    if(u.note) h+=`<p class="unote">${esc(u.note)}</p>`;
    rows.forEach(l=>{
      const isNum=/^\d/.test(l.no);
      h+=`<div class="les${l.skip?' skip':''}" style="--k:${u.color}"><div class="no">${esc(l.no)}${isNum?'<small>차시</small>':''}</div><div><h3>${esc(l.title)}<span class="meta">${esc(l.pages||'')}</span>${l.skip?`<span class="sk">${esc(l.skip)}</span>`:''}${l.updated?`<span class="up">${l.updated.slice(5).replace('-','/')} 수정</span>`:''}</h3><div class="links">${l.links.map(linkHTML).join('')}</div></div></div>`;
    });
  });
  $('list').innerHTML=h||'<p class="empty">찾는 자료가 없어요.</p>';
}
// 단원 칩
$('uchips').innerHTML=[['all','전체'],...UNITS.map(u=>[u.id,u.n])].map(([id,n])=>`<button data-u="${id}" class="${id==='all'?'on':''}">${n}</button>`).join('');
$('uchips').onclick=e=>{const b=e.target.closest('button'); if(!b) return; unitSel=b.dataset.u; [...$('uchips').children].forEach(x=>x.classList.toggle('on',x===b)); render();};
$('q').oninput=render;
$('tForm').onchange=e=>document.body.classList.toggle('hideForm',!e.target.checked);
$('tSkip').onchange=e=>document.body.classList.toggle('hideSkip',!e.target.checked);
// 최근 업데이트
const rec=[]; UNITS.forEach(u=>u.lessons.forEach(l=>{ if(l.updated) rec.push([l.updated,u,l]); }));
rec.sort((a,b)=>b[0].localeCompare(a[0]));
$('recent').innerHTML=rec.slice(0,8).map(([d,u,l])=>{const main=l.links.find(x=>x[0]==='course')||l.links[0]; return `<li><time>${d.slice(5).replace('-','/')}</time><span style="color:${u.color};font-weight:900">${u.n}</span><a href="${esc(main[2])}" target="_blank" rel="noopener">${esc(l.no)} ${esc(l.title)}</a></li>`;}).join('');
$('common').innerHTML=COMMON.map(linkHTML).join('');
$('legend').innerHTML=Object.entries(TYPES).map(([k,[n,ic]])=>`<span class="tag" style="--t:var(--${k})">${ic} ${n}</span>`).join('');
// 주소 복사
let tm; function toast(m){$('toast').textContent=m; $('toast').classList.add('on'); clearTimeout(tm); tm=setTimeout(()=>$('toast').classList.remove('on'),1600);}
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-u]'); if(!b||!b.closest('.lk')) return; e.preventDefault();
  try{await navigator.clipboard.writeText(b.dataset.u); toast('주소를 복사했어요');}catch(err){prompt('주소를 복사하세요',b.dataset.u);} });
render();
</script>
</body>
</html>
