<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>내 세특 확인 · 정보 과제 연구</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --ink: #1a1d21; --muted: #687280; --line: #e3e6ea;
      --accent: #2563eb; --soft: #eef2ff; --ok: #0d9488; --okbg: #ecfdf5; --warn: #b45309; --warnbg: #fff7ed;
      --bad: #dc2626; --shadow: 0 16px 40px rgba(25, 34, 53, .08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171a; --card: #1c2024; --ink: #e8eaed; --muted: #9aa3ad; --line: #2c3238;
        --accent: #5b8cff; --soft: #1e2536; --ok: #2dd4bf; --okbg: #042f2e; --warn: #fbbf24; --warnbg: #3a2a10;
        --bad: #f87171; --shadow: 0 18px 44px rgba(0, 0, 0, .24);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink); line-height: 1.65; -webkit-text-size-adjust: 100%;
      background: radial-gradient(circle at top left, var(--soft), transparent 34rem), var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    .wrap { max-width: 780px; margin: 0 auto; padding: 36px 18px 64px; }
    header { padding: 8px 0 22px; }
    .eyebrow { display: inline-block; margin-bottom: 12px; border-radius: 999px; background: var(--accent); color: #fff; font-size: .78rem; font-weight: 800; padding: 5px 12px; }
    h1 { margin: 0; font-size: clamp(1.6rem, 4.5vw, 2.2rem); letter-spacing: -.04em; line-height: 1.2; }
    .lead { margin: 12px 0 0; color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 14px; }
    label { display: block; font-size: .82rem; font-weight: 700; color: var(--muted); margin: 10px 0 5px; }
    input, textarea {
      width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--card); color: var(--ink); font-size: 1rem; font-family: inherit;
    }
    textarea { min-height: 130px; resize: vertical; line-height: 1.6; }
    input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    button {
      font-family: inherit; font-size: .95rem; font-weight: 700; border: 0; border-radius: 9px;
      padding: 12px 20px; cursor: pointer; background: var(--accent); color: #fff; width: 100%; margin-top: 16px;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .6; cursor: default; }
    button.ok { background: var(--ok); }
    button.fix { background: transparent; color: var(--warn); border: 1px solid var(--warn); }
    button.ghost { width: auto; background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 7px 12px; margin: 0; }
    .row { display: flex; gap: 10px; }
    .row button { flex: 1; }
    .msg { min-height: 22px; margin-top: 10px; text-align: center; font-size: .92rem; font-weight: 700; }
    .msg.err { color: var(--bad); }
    .hint { margin: 12px 0 0; color: var(--muted); font-size: .82rem; text-align: center; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .who b { font-size: 1.15rem; }
    .text { white-space: pre-wrap; word-break: keep-all; font-size: 1rem; line-height: 1.85; margin: 14px 0 6px; }
    .meta { color: var(--muted); font-size: .82rem; }
    .status { border-radius: 12px; padding: 12px 14px; font-size: .92rem; margin-top: 4px; }
    .status.ok { background: var(--okbg); color: var(--ok); }
    .status.fix { background: var(--warnbg); color: var(--warn); }
    .status .req { color: var(--ink); white-space: pre-wrap; margin-top: 6px; font-weight: 400; }
    .guide { color: var(--muted); font-size: .9rem; margin: 0 0 6px; }
    .count { text-align: right; color: var(--muted); font-size: .78rem; margin-top: 4px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="eyebrow">정보 과제 연구</span>
      <h1>내 세특 확인</h1>
      <p class="lead">학번, 이름, 과제 제출 때 쓰던 비밀번호 4자리를 넣으면 본인의 세부능력 및 특기사항을 볼 수 있습니다.</p>
    </header>

    <section class="card" id="login">
      <label for="sid">학번 (예: 30101)</label>
      <input id="sid" inputmode="numeric" autocomplete="off" maxlength="5">
      <label for="name">이름</label>
      <input id="name" autocomplete="off">
      <label for="pw">비밀번호 4자리</label>
      <input id="pw" type="password" inputmode="numeric" autocomplete="off" maxlength="10">
      <button id="go">세특 보기</button>
      <div class="msg" id="loginMsg"></div>
      <p class="hint">비밀번호가 기억나지 않으면 선생님께 직접 물어보세요.</p>
    </section>

    <section class="hidden" id="view">
      <div class="card">
        <div class="top">
          <div class="who"><b id="whoName"></b> <span class="meta" id="whoSid"></span></div>
          <button class="ghost" id="out">나가기</button>
        </div>
        <div class="text" id="text"></div>
        <div class="meta" id="len"></div>
      </div>

      <div class="card hidden" id="statusCard">
        <div class="status" id="status"></div>
      </div>

      <div class="card" id="answer">
        <p class="guide">끝까지 읽고, 사실과 다른 내용이나 고치고 싶은 부분이 있으면 「수정 요청」에 구체적으로 적어 주세요. 다시 보내면 마지막 내용으로 바뀝니다.</p>
        <div class="row">
          <button class="ok" id="okBtn">이상 없음</button>
          <button class="fix" id="fixBtn">수정 요청</button>
        </div>
        <div class="hidden" id="fixBox">
          <label for="note">수정 요청 내용</label>
          <textarea id="note" maxlength="1000" placeholder="예: 두 번째 문장의 '설문'은 실제로는 '관찰'로 하려고 했습니다. / 진로를 간호가 아니라 보건 행정으로 바꿔 주세요."></textarea>
          <div class="count" id="noteCount">0 / 1000</div>
          <button id="sendFix">수정 요청 보내기</button>
        </div>
        <div class="msg" id="ansMsg"></div>
      </div>
    </section>
  </div>

<script>
  var API = "https://script.google.com/macros/s/AKfycbyVR_VzoQSZ8AJ-GgsQpGsjSJyRJY5yU66GozjOT2U9kNOPEcJuvLhGvaVZRiBI-kih/exec";
  /* 쿠키 없이(익명으로) 보낸다. 브라우저에 어떤 구글 계정이 로그인되어 있어도 영향이 없다. */
  function call(body, ok, fail) {
    fetch(API, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body),
      credentials: "omit",
      redirect: "follow"
    }).then(function (r) { return r.json(); }).then(ok).catch(fail);
  }
  var me = null;
  var $ = function (id) { return document.getElementById(id); };
  var reasons = {
    auth: "학번, 이름, 비밀번호를 다시 확인해 주세요.",
    wait: "여러 번 틀려서 10분 동안 잠겼습니다. 잠시 뒤 다시 해 주세요.",
    "no-row": "세특이 아직 등록되지 않았습니다. 선생님께 알려 주세요.",
    empty: "수정 요청 내용을 적어 주세요."
  };

  function busy(btns, on) { btns.forEach(function (b) { $(b).disabled = on; }); }

  function login() {
    var sid = $("sid").value.trim(), name = $("name").value.trim(), pw = $("pw").value.trim();
    $("loginMsg").className = "msg"; $("loginMsg").textContent = "";
    if (!sid || !name || !pw) { $("loginMsg").className = "msg err"; $("loginMsg").textContent = "세 칸을 모두 입력해 주세요."; return; }
    busy(["go"], true); $("loginMsg").textContent = "불러오는 중…";
    call({ action: "view", sid: sid, name: name, pw: pw }, function (r) {
        busy(["go"], false);
        if (!r || !r.ok) { $("loginMsg").className = "msg err"; $("loginMsg").textContent = reasons[(r && r.reason)] || "다시 시도해 주세요."; return; }
        me = { sid: sid, name: name, pw: pw };
        $("loginMsg").textContent = "";
        show(r);
      }, function () { busy(["go"], false); $("loginMsg").className = "msg err"; $("loginMsg").textContent = "연결에 실패했습니다. 잠시 뒤 다시 해 주세요."; });
  }

  function show(r) {
    $("login").classList.add("hidden");
    $("view").classList.remove("hidden");
    $("whoName").textContent = r.name;
    $("whoSid").textContent = r.sid;
    $("text").textContent = r.text || "(내용 없음)";
    $("len").textContent = (r.text || "").length + "자";
    $("note").value = r.status === "수정 요청" ? (r.request || "") : "";
    count();
    setStatus(r.status, r.request, r.when);
  }

  function setStatus(st, req, when) {
    if (!st) { $("statusCard").classList.add("hidden"); return; }
    $("statusCard").classList.remove("hidden");
    var box = $("status");
    box.className = "status " + (st === "수정 요청" ? "fix" : "ok");
    box.innerHTML = "";
    var head = document.createElement("div");
    head.style.fontWeight = "800";
    head.textContent = (st === "수정 요청" ? "수정 요청을 보냈습니다" : "이상 없음으로 확인했습니다") + (when ? " · " + when : "");
    box.appendChild(head);
    if (st === "수정 요청" && req) {
      var p = document.createElement("div"); p.className = "req"; p.textContent = req; box.appendChild(p);
    }
  }

  function send(kind) {
    var note = kind === "fix" ? $("note").value.trim() : "";
    if (kind === "fix" && !note) { $("ansMsg").className = "msg err"; $("ansMsg").textContent = reasons.empty; return; }
    if (kind === "ok" && !confirm("세특 내용에 이상이 없음을 확인합니다.")) return;
    busy(["okBtn", "fixBtn", "sendFix"], true);
    $("ansMsg").className = "msg"; $("ansMsg").textContent = "보내는 중…";
    call({ action: "answer", sid: me.sid, name: me.name, pw: me.pw, kind: kind, note: note }, function (r) {
        busy(["okBtn", "fixBtn", "sendFix"], false);
        if (!r || !r.ok) { $("ansMsg").className = "msg err"; $("ansMsg").textContent = reasons[(r && r.reason)] || "다시 시도해 주세요."; return; }
        $("ansMsg").textContent = "선생님께 전달했습니다.";
        $("fixBox").classList.add("hidden");
        setStatus(r.status, note, r.when);
      }, function () { busy(["okBtn", "fixBtn", "sendFix"], false); $("ansMsg").className = "msg err"; $("ansMsg").textContent = "보내지 못했습니다. 다시 눌러 주세요."; });
  }

  function count() { $("noteCount").textContent = $("note").value.length + " / 1000"; }

  $("go").addEventListener("click", login);
  ["sid", "name", "pw"].forEach(function (id) { $(id).addEventListener("keydown", function (e) { if (e.key === "Enter") login(); }); });
  $("okBtn").addEventListener("click", function () { send("ok"); });
  $("fixBtn").addEventListener("click", function () { $("fixBox").classList.toggle("hidden"); $("ansMsg").textContent = ""; if (!$("fixBox").classList.contains("hidden")) $("note").focus(); });
  $("sendFix").addEventListener("click", function () { send("fix"); });
  $("note").addEventListener("input", count);
  $("out").addEventListener("click", function () {
    me = null; $("pw").value = ""; $("view").classList.add("hidden"); $("login").classList.remove("hidden");
    $("statusCard").classList.add("hidden"); $("fixBox").classList.add("hidden"); $("ansMsg").textContent = "";
  });
</script>
</body>
</html>
